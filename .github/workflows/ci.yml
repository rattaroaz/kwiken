name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Rust tests
        run: npm run test:rust

      - name: Build frontend
        run: npm run build

  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: E2E tests
        run: npm run test:e2e
        env:
          CI: true

  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            arch_label: x64
            vc_arch: x64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            arch_label: arm64
            vc_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Prefer MSVC linker over Git link.exe
        shell: pwsh
        run: ./scripts/fix-windows-linker-path.ps1

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.vc_arch }}

      - name: Add Windows SDK headers for clang
        shell: pwsh
        run: ./scripts/setup-windows-sdk-includes.ps1 -Arch ${{ matrix.vc_arch }}

      - name: Install LLVM (ARM64)
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: ./scripts/install-llvm-ci.ps1

      - name: Install dependencies
        run: npm ci

      - name: Build unsigned Windows installers
        run: npm run build:win -- --target ${{ matrix.target }}

      - name: Verify installer artifacts
        shell: pwsh
        run: ./scripts/verify-windows-bundle.ps1 -TargetTriple ${{ matrix.target }} -ArchLabel ${{ matrix.arch_label }}

      - name: Smoke test (real binary startup)
        run: node scripts/smoke-test.mjs
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
          SMOKE_STARTUP_MS: 5000

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify required source files
        shell: pwsh
        run: |
          $required = @(
            "src/components/logs/LogPanel.tsx",
            "src/stores/logStore.ts"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              Write-Error "Missing required file: $path (check .gitignore and git add)"
              exit 1
            }
          }

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Enable VBScript for WiX MSI
        shell: pwsh
        run: |
          $cap = Get-WindowsCapability -Online | Where-Object { $_.Name -like "VBSCRIPT*" }
          if ($cap -and $cap.State -ne "Installed") {
            Add-WindowsCapability -Online -Name $cap.Name
          } elseif (-not $cap) {
            dism /online /enable-feature /featurename:VBSCRIPT /norestart
          }

      - name: Normalize signing secrets
        shell: bash
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RAW_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$RAW_KEY" ] || [ -z "$RAW_PASSWORD" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD must be set."
            exit 1
          fi
          {
            echo "TAURI_SIGNING_PRIVATE_KEY<<EOF"
            printf '%s' "$RAW_KEY" | tr -d '\r\n'
            echo
            echo "EOF"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD<<EOF"
            printf '%s' "$RAW_PASSWORD" | tr -d '\r\n'
            echo
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Extract release notes
        id: changelog
        shell: bash
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          NOTES=$(node scripts/extract-changelog.mjs "$TAG")
          {
            echo "body<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseName: "Kwiken ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles nsis,msi

      - name: Verify MSI artifact
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path src-tauri/target/release/bundle/msi -Filter *.msi -ErrorAction SilentlyContinue
          if (-not $msi) { Write-Error "MSI artifact not found"; exit 1 }
          Write-Host "Found MSI: $($msi.FullName)"
